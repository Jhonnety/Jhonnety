name: GitHub Activity Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      # Genera gráfico de actividad con diseño moderno
      - name: Generate Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@v1.3.2
        with:
          username: Jhonnety
          bg_color: 0d1117
          color: 58a6ff
          line: 1f6feb
          point: ff6b35
          area: true
          area_color: 1f6feb
          title_color: 58a6ff
          custom_title: "📈 Contribution Activity Graph"
          theme: github-dark
          
      - name: Commit Graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update activity graph" && git push)
