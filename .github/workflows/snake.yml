name: Generate GitHub Contribution Snake

on:
  # Se ejecuta automáticamente cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
  
  # Se ejecuta en cada push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Genera el snake con tema personalizado oscuro/azul
      - name: Generate snake.svg (GitHub Dark theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jhonnety
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      # Sube los archivos generados a la rama output
      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
